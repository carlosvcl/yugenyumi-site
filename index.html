<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baixar YugenYumi Client</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #7289da; --bg-dark: #050508; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://raw.githubusercontent.com/carlosvcl/yugen-files/main/assets/fundo.jpg'); /* Puxa seu fundo do repo antigo */
            background-size: cover;
            background-position: center;
        }

        .overlay { position: fixed; inset: 0; background: rgba(10, 10, 15, 0.7); backdrop-filter: blur(5px); z-index: -1; }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: 64px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #aaa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p { color: #ccc; font-size: 18px; margin-bottom: 40px; max-width: 600px; margin-left: auto; margin-right: auto; }

        .btn-download {
            display: inline-block;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: 800;
            color: white;
            background: linear-gradient(135deg, #7289da, #5865F2);
            border-radius: 16px;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(114, 137, 218, 0.4);
            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-download:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 20px 40px rgba(114, 137, 218, 0.6); }

        .features { display: flex; gap: 20px; justify-content: center; margin-top: 40px; }
        .tag { background: rgba(255,255,255,0.05); padding: 8px 15px; border-radius: 20px; font-size: 12px; border: 1px solid rgba(255,255,255,0.1); }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h1>YugenYumi</h1>
        <p>A nova geração de Client PvP para Minecraft 1.8.9. Otimizado, Customizável e Gratuito.</p>
        
        <a href="https://github.com/carlosvcl/yugenyumi-client/releases/download/v1.0.0/YugenYumi.Client.Setup.1.0.0.exe" class="btn-download">
            BAIXAR PARA WINDOWS
        </a>

        <div class="features">
            <div class="tag">⚡ FPS Boost</div>
            <div class="tag">⚔️ Mods PvP</div>
            <div class="tag">🎨 Cosméticos</div>
        </div>
    </div>
</body>
</html>
